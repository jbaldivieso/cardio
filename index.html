<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00d1b2" />
    <meta name="description" content="Offline flashcards with mastery-weighted quizzing" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cardio</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong
      // palette. Keep in sync with src/stores/theme.ts, which reads the same key
      // by the same rules; theme.spec.ts runs this script and holds them to it.
      try {
        var stored = localStorage.getItem('cardio.theme')
        // Anything else in that key — a value from a future version, a
        // half-written string — is a missing preference, exactly as the store
        // treats it. Reading it as 'light' would repaint on every reload.
        var pref = stored === 'light' || stored === 'dark' ? stored : 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
